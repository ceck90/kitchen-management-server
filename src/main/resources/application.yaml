server:
  port: ${SERVER_PORT:8080}
spring:
  mongodb:
    database: ${MONGO_DATABASE:kitchenmgmt}
    uri: ${MONGO_URI:mongodb://root:example@mongo:27017/}
  output:
    ansi:
      enabled: always
  banner:
    location: ./banner.txt
  data:
    postgres:
      url: ${POSTGRES_URL:jdbc:pgsql://localhost:5432/bear}
      user: ${POSTGRES_USER:root}
      password: ${POSTGRES_PASSWORD:example}
    postgres-ack:
      jdbc-url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/bear}
      username: ${POSTGRES_USER:root}
      password: ${POSTGRES_PASSWORD:example}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: ${POSTGRES_MAX_POOL_SIZE:10}
      hibernate:
        ddl-auto: none
      show-sql: ${POSTGRES_SHOW_SQL:true}
    task:
      scheduling:
        enabled: true
application:
  version: 2.0.0
  title: Kitchen Management Server
  jobs:
    order-ack:
      fixedDelay: ${ORDER_ACK_FIXED_DELAY:60000}
      interval: ${ORDER_ACK_INTERVAL:120000}
  menu-item-notes-separator: /
  enable-orders-auto-insert: ${ENABLE_ORDERS_AUTO_INSERT:false}
  priority-order-notes-regex: '(?i)\b(bambino|bambini|urgente)\b'
logging:
  level:
    org:
      springframework:
        data:
          mongodb:
            core:
              MongoTemplate: DEBUG
