name: km-server

services:
  km-server:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: km_server
    restart: no
    depends_on:
      - mongo
    ports:
      - "${SERVER_HOST_PORT:-8080}:8080"
    networks:
      - mfo-network
    environment:
      SERVER_PORT: 8080
      TZ: ${TZ_SERVER:-Europe/Rome}
      POSTGRES_URL: jdbc:pgsql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      POSTGRES_JDBC_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ENABLE_ORDERS_AUTO_INSERT: ${ENABLE_ORDERS_AUTO_INSERT:-false}
      MONGO_DATABASE: kitchenmgmt
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/

  mongo:
    image: mongo
    container_name: mongo_db
    restart: no
    ports:
      - "${MONGO_HOST_PORT}:27017"
    networks:
      - mfo-network
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db

networks:
  mfo-network:
    name: ${BB_NETWORK}
    external: true

volumes:
  mongo_data:
